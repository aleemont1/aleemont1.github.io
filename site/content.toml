summary = { en = "The firmware of the flight computer on Atlas, Aurora Rocketry's rocket for EuRoC 2026. It reads the IMU and the barometer at 50 Hz, works out which of 12 flight states the rocket is in, fires the parachute charges and sends telemetry to the ground over LoRa. I'm the project manager of the avionics team, seven people. Launches are rare, so most testing happens on the bench, with a RocketPy simulation feeding the board fake sensor data.", it = "Il firmware del flight computer di Atlas, il razzo di Aurora Rocketry per EuRoC 2026. Legge IMU e barometro a 50 Hz, capisce in quale dei 12 stati di volo si trova il razzo, aziona le cariche dei paracadute e manda la telemetria a terra su LoRa. Sono il project manager del team di avionica, sette persone. I lanci sono rari, quindi quasi tutti i test si fanno al banco, con una simulazione RocketPy che fornisce alla scheda dati dei sensori finti." }
caption = { en = "The 12 flight states. The parachutes fire on entering apogee.", it = "I 12 stati di volo. I paracadute partono all'ingresso in apogeo." }
image = { file = "avionics-boards", widths = [800, 1280], w = 1280, h = 960, alt = { en = "Two avionics boards held in hand: a round white board and a black ESP32 board", it = "Due schede di avionica tenute in mano: una rotonda bianca e una nera con ESP32" }, caption = { en = "Avionics boards. Photo: Aurora Rocketry.", it = "Schede di avionica. Foto: Aurora Rocketry." } }
