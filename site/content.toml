[[projects.detail.sections]]
heading = { en = "One task set per flight state", it = "Un insieme di task per ogni stato" }
body = { en = [
  "The firmware is a state machine with 12 states, from calibration on the pad to recovered on the ground. It runs as a 50 Hz FreeRTOS task with a watchdog on it. Each state declares the tasks it needs: on every transition the state machine stops the ones that are no longer needed and starts the missing ones. On the pad there's no point in logging to flash at full rate, and in flight there's no point in running the Wi-Fi dashboard.",
  "Sensor reading and altitude estimation run on one core. Storage, telemetry and the dashboard run on the other, so flash and radio work stays off the core that reads the sensors.",
], it = [
  "Il firmware è una macchina a stati con 12 stati, dalla calibrazione sulla rampa fino al razzo recuperato. Gira come task FreeRTOS a 50 Hz, sotto watchdog. Ogni stato dichiara i task che gli servono: a ogni transizione la macchina a stati ferma quelli che non servono più e avvia quelli che mancano. Sulla rampa non ha senso scrivere su flash a piena velocità, e in volo non ha senso tenere accesa la dashboard Wi-Fi.",
  "Lettura dei sensori e stima dell'altitudine girano su un core. Salvataggio, telemetria e dashboard sull'altro, così flash e radio restano fuori dal core che legge i sensori.",
] }

[[projects.detail.sections]]
heading = { en = "Finding apogee", it = "Trovare l'apogeo" }
body = { en = [
  "Apogee comes from barometric altitude. A median filter removes spikes, and a least-squares fit over a sliding window gives the vertical velocity. When it stops climbing, the recovery charges fire: one parachute or two, depending on the configuration. A time lockout stops it from triggering too early during the burn, and a time backstop fires it anyway if apogee hasn't been detected by then.",
], it = [
  "L'apogeo si ricava dall'altitudine barometrica. Un filtro mediano toglie i picchi, e una regressione ai minimi quadrati su una finestra mobile dà la velocità verticale. Quando il razzo smette di salire partono le cariche di recupero: uno o due paracadute, a seconda della configurazione. Un blocco temporale evita che scatti troppo presto durante la spinta, e un limite di tempo lo fa scattare comunque se l'apogeo non è ancora stato rilevato.",
] }

[[projects.detail.sections]]
heading = { en = "Before launch", it = "Prima del lancio" }
body = { en = [
  "On the ground the board opens its own Wi-Fi access point and serves a small web app: live sensor data, health checks, a pre-launch checklist, flight parameters and firmware updates. When we declare the rocket ready for launch, the parameters are validated and frozen, so nothing can change them mid-flight.",
], it = [
  "A terra la scheda apre un proprio access point Wi-Fi e serve una piccola web app: dati dei sensori in diretta, controlli di stato, una checklist pre-lancio, i parametri di volo e gli aggiornamenti del firmware. Quando dichiariamo il razzo pronto al lancio, i parametri vengono validati e congelati, così niente può cambiarli in volo.",
] }

[[projects.detail.sections]]
heading = { en = "Testing without launching", it = "Testare senza lanciare" }
image = { file = "nemesis-to-pad", widths = [800, 1600], w = 1600, h = 1202, alt = { en = "Team members in hard hats carrying the Nemesis rocket across a dusty launch site", it = "Membri del team con il casco che trasportano il razzo Nemesis sul terreno polveroso del sito di lancio" }, caption = { en = "Nemesis, our 2025 rocket, on its way to the pad. Photo: Aurora Rocketry.", it = "Nemesis, il nostro razzo del 2025, verso la rampa. Foto: Aurora Rocketry." } }
body = { en = [
  "Launching a rocket means permits, a site, travel and money, so it doesn't happen often. In hardware-in-the-loop builds, a RocketPy simulation on a laptop sends sensor data to the board over TCP, in lockstep, and the real state machine, filters and recovery logic react to it. There's also a guided routine that checks every sensor and output on the bench.",
], it = [
  "Lanciare un razzo vuol dire permessi, un sito, trasferte e soldi, quindi non capita spesso. Nelle build hardware-in-the-loop una simulazione RocketPy su un portatile invia alla scheda i dati dei sensori via TCP, in lockstep, e la vera macchina a stati, i filtri e la logica di recupero reagiscono. C'è anche una routine guidata che verifica al banco ogni sensore e ogni uscita.",
] }

[[projects.detail.sections]]
heading = { en = "Telemetry", it = "Telemetria" }
image = { file = "ground-station", widths = [800, 1600], w = 1600, h = 900, alt = { en = "A laptop and radio equipment on a terrace at sunset, overlooking a city", it = "Un portatile e apparecchiature radio su una terrazza al tramonto, sopra la città" }, caption = { en = "Ground station laptop at sunset. Photo: Aurora Rocketry.", it = "Il portatile della ground station al tramonto. Foto: Aurora Rocketry." } }
body = { en = [
  "The rocket body is aluminium, which blocks radio, so the electronics bay sits behind a PMMA window. In open-field tests for my thesis, the E220 modules kept a link beyond 2 km with an average throughput of about 640 bytes per second.",
  "A telemetry packet is bigger than one LoRa frame, so the thesis protocol already split data into chunks with a CRC, and dropped incomplete messages after a timeout. It had no retransmissions, though. Adding them without wasting airtime became LAMP.",
], it = [
  "Il corpo del razzo è in alluminio, che blocca le onde radio, quindi la electronics bay sta dietro una finestra in PMMA. Nei test in campo aperto della tesi i moduli E220 hanno tenuto il collegamento oltre i 2 km, con un throughput medio di circa 640 byte al secondo.",
  "Un pacchetto di telemetria è più grande di un frame LoRa, quindi il protocollo della tesi divideva già i dati in pezzi con un CRC, e scartava i messaggi incompleti dopo un timeout. Però non ritrasmetteva nulla. Aggiungere le ritrasmissioni senza sprecare tempo in aria è diventato LAMP.",
] }

[[projects]]
slug = "lamp"
featured = true
title = "LAMP"
subtitle = { en = "Bulk data transfer over LoRa", it = "Trasferire tanti dati su LoRa" }
stack = ["C++17", "LoRa", "SX1262", "ns-3", "Unity"]
summary = { en = "A LoRa frame holds about 255 bytes, so a flight log has to be sent in pieces. The usual approach waits for an ACK after every piece. LAMP sends a burst and gets back a single bitmap of what's missing. In ns-3, in an urban channel at SF7, that gives 4.6 km of range at 90% delivery, against 3.4 km for stop-and-wait. I'm writing the paper with Prof. Andrea Piroddi.", it = "Un frame LoRa contiene circa 255 byte, quindi un log di volo va spedito a pezzi. L'approccio classico aspetta un ACK dopo ogni pezzo. LAMP manda una raffica e riceve un'unica bitmap con quello che manca. In ns-3, in canale urbano a SF7, questo vuol dire 4,6 km di portata con il 90% dei pacchetti consegnati, contro 3,4 km dello stop-and-wait. Sto scrivendo il paper con il Prof. Andrea Piroddi." }
caption = { en = "Top: one chunk on air. Below: chunk 3 is lost. Stop-and-wait pays an ACK per chunk; LAMP pays one bitmap per burst and resends only chunk 3.", it = "In alto: un pezzo in trasmissione. Sotto: il pezzo 3 va perso. Lo stop-and-wait paga un ACK per pezzo; LAMP una bitmap per raffica, e ritrasmette solo il pezzo 3." }
links = [
  { kind = "code", url = "https://github.com/aleemont1/LAMP" },
  { kind = "paper", url = "https://aleemont1.github.io/lora-paper/" },
]

[projects.detail]
diagram = "lamp"
meta = { en = "Research with Prof. Andrea Piroddi, University of Bologna · July 2025 – now", it = "Ricerca con il Prof. Andrea Piroddi, Università di Bologna · luglio 2025 – oggi" }
intro = { en = [
  "LAMP grew out of the rocket telemetry in my bachelor's thesis. That protocol split data into chunks but had no way to recover a lost one. LAMP adds recovery, and the question behind it is how to do that without spending the little airtime LoRa gives you on acknowledgments.",
], it = [
  "LAMP nasce dalla telemetria del razzo della mia tesi triennale. Quel protocollo divideva i dati in pezzi, ma non aveva modo di recuperarne uno perso. LAMP aggiunge il recupero, e la domanda dietro è come farlo senza spendere in conferme il poco tempo in aria che LoRa ti concede.",
] }

[[projects.detail.sections]]
heading = { en = "Why acknowledgments are expensive", it = "Perché le conferme costano" }
body = { en = [
  "LoRa trades speed for range: at SF7 a full frame stays on air for about 0.4 seconds, and in the EU 868 MHz band you may only transmit for a fraction of the time. Stop-and-wait sends a chunk, waits for its ACK, then sends the next. Every ACK costs airtime, and every lost ACK costs a retry even if the data arrived fine.",
], it = [
  "LoRa scambia velocità con portata: a SF7 un frame pieno resta in aria per circa 0,4 secondi, e nella banda europea a 868 MHz si può trasmettere solo per una frazione del tempo. Lo stop-and-wait manda un pezzo, aspetta il suo ACK, poi manda il successivo. Ogni ACK costa tempo in aria, e ogni ACK perso costa un tentativo anche se i dati erano arrivati.",
] }

[[projects.detail.sections]]
heading = { en = "How LAMP does it", it = "Come funziona LAMP" }
body = { en = [
  "A payload is split into up to 255 chunks per transmission window. Each chunk has a 9-byte header, with 8-bit node addresses, and a 2-byte CRC-16. Start and end of a message are implied by the chunk index, so they cost no header bits.",
  "There are four modes: connectionless or with a handshake, best-effort or with SACK-ARQ. In the reliable modes the receiver stays quiet until the end of a burst, then answers with one bitmap marking every missing chunk, and the sender resends only those. The core is plain C++17 with no radio code in it; the unit tests run on a laptop.",
], it = [
  "Un payload viene diviso in un massimo di 255 pezzi per finestra di trasmissione. Ogni pezzo ha un header di 9 byte, con indirizzi dei nodi a 8 bit, e un CRC-16 di 2 byte. Inizio e fine del messaggio si deducono dall'indice del pezzo, quindi non costano bit nell'header.",
  "Ci sono quattro modalità: senza connessione o con handshake, best-effort o con SACK-ARQ. Nelle modalità affidabili il ricevitore sta zitto fino alla fine della raffica, poi risponde con una bitmap che segna tutti i pezzi mancanti, e il mittente ritrasmette solo quelli. Il core è C++17 puro, senza codice radio; i test unitari girano su un portatile.",
] }

[[projects.detail.sections]]
heading = { en = "Results", it = "Risultati" }
chart = "lamp-range"
body = { en = [
  "I ran 295,800 ns-3 simulations across static, urban, rural and over-water channels. Compared with stop-and-wait, the range at 90% delivery grows by 22–35% in urban channels, 14% over water and 8–17% in rural ones. Where the channel is clean, the SACK modes are 14–16% faster at SF7.",
  "What LAMP doesn't change is the duty cycle. Under a 10% limit, sustained throughput is bound by airtime, around 488 bit/s at SF7, whatever the mode. What changes is how long a single transfer takes and how likely it is to get through fading. The simulations were checked on a bench with two ESP32-S3 / SX1262 boards, within 7%.",
], it = [
  "Ho fatto girare 295.800 simulazioni ns-3 su canali statici, urbani, rurali e sull'acqua. Rispetto allo stop-and-wait, la portata con il 90% di consegna cresce del 22–35% in canale urbano, del 14% sull'acqua e dell'8–17% in campagna. Dove il canale è pulito, le modalità SACK sono più veloci del 14–16% a SF7.",
  "Quello che LAMP non cambia è il duty cycle. Con un limite del 10% il throughput sostenuto dipende dal tempo in aria, circa 488 bit/s a SF7, qualunque sia la modalità. Cambia quanto dura un singolo trasferimento e quanto è probabile che superi il fading. Le simulazioni sono state verificate al banco con due schede ESP32-S3 / SX1262, con scarti entro il 7%.",
] }

