summary = { en = "A group chat I wrote to study replication. Every user gets a container with a full SQLite copy of every room. Nodes converge by gossip and agree on message order with vector clocks, and a node keeps accepting messages when it's cut off or Redis is down.", it = "Una chat di gruppo che ho scritto per studiare la replicazione. Ogni utente ha un container con una copia SQLite completa di tutte le stanze. I nodi convergono via gossip e concordano l'ordine dei messaggi con i vector clock, e un nodo continua ad accettare messaggi anche se è isolato o Redis è giù." }
links = [{ kind = "code", url = "https://github.com/aleemont1/federated-lightweight-chat" }]

