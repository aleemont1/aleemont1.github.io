[[projects.detail.sections]]
heading = { en = "Borealis: the flight computer", it = "Borealis: il flight computer" }
body = { en = [
  "The Borealis flight computer is built around an ESP32-S3 on an Arduino Nano ESP32, on round black boards: a sensor module, and an actuator module that fires the pyrotechnic charges. An Extended Kalman Filter combines the IMU with two barometers on a static port, to estimate orientation, vertical velocity and altitude. The filter corrects the IMU's drift and smooths out the barometers' noise.",
  "When the vertical velocity reaches zero and the rocket starts to fall, it detects apogee and fires the drogue parachute. The main parachute opens at 450 m.",
], it = [
  "Il flight computer di Borealis è basato su un ESP32-S3 montato su un Arduino Nano ESP32, su schede nere rotonde: un modulo sensori e un modulo attuatori che aziona le cariche pirotecniche. Un Extended Kalman Filter combina la IMU con due barometri collegati a una presa statica, per stimare orientamento, velocità verticale e altitudine. Il filtro corregge la deriva della IMU e attenua il rumore dei barometri.",
  "Quando la velocità verticale si annulla e il razzo inizia a scendere, rileva l'apogeo e apre il paracadute drogue. Il principale si apre a 450 m.",
] }
facts = [
  { k = "MCU", v = "ESP32-S3 (Arduino Nano ESP32)" },
  { k = "IMU", v = "Bosch BNO055" },
  { k = { en = "Barometers", it = "Barometri" }, v = "2 × Adafruit MPRLS" },
  { k = { en = "Fusion", it = "Fusione" }, v = "Extended Kalman Filter" },
  { k = "Radio", v = "EByte E220-900T22D, 868 MHz" },
  { k = { en = "Recovery", it = "Recupero" }, v = { en = "Drogue at apogee, main at 450 m", it = "Drogue all'apogeo, principale a 450 m" } },
]
image = { file = "borealis-ebay", widths = [720], w = 720, h = 960, alt = { en = "The Borealis electronics bay: a round black board with a LoRa antenna and a battery, mounted on threaded rods inside a transparent tube", it = "La electronics bay di Borealis: una scheda nera rotonda con antenna LoRa e batteria, montata su barre filettate dentro un tubo trasparente" }, caption = { en = "The Borealis electronics bay, from my thesis.", it = "La electronics bay di Borealis, dalla mia tesi." } }

[[projects.detail.sections]]
heading = { en = "Borealis: telemetry", it = "Borealis: la telemetria" }
body = { en = [
  "The link is one-way, point to point: an E220 LoRa module on the rocket, another at the ground station on an ESP32-S3 that forwards everything to a laptop. On the ground there's a directional Yagi antenna and no tracking system, so someone has to point it at the rocket by hand.",
  "The rocket body is aluminium, which blocks radio, so the electronics bay sits behind a PMMA window. Flight data goes into a JSON object, gets delta-compressed, split into chunks that fit a LoRa frame, and each chunk gets a small header and a CRC. The ground station puts chunks back in order, rebuilds the message and throws away anything incomplete after a timeout.",
  "In open-field tests the link held beyond 2 km, with an average throughput of about 640 bytes per second. What it couldn't do was recover a lost chunk. Adding that without wasting airtime became LAMP.",
], it = [
  "Il collegamento è unidirezionale, punto a punto: un modulo LoRa E220 sul razzo, un altro alla ground station su un ESP32-S3 che inoltra tutto a un portatile. A terra c'è un'antenna Yagi direzionale e nessun sistema di inseguimento, quindi qualcuno deve puntarla a mano verso il razzo.",
  "Il corpo del razzo è in alluminio, che blocca le onde radio, quindi la electronics bay sta dietro una finestra in PMMA. I dati di volo finiscono in un oggetto JSON, vengono compressi in delta, divisi in pezzi che stanno in un frame LoRa, e ogni pezzo riceve un piccolo header e un CRC. La ground station rimette i pezzi in ordine, ricostruisce il messaggio e scarta quello che resta incompleto dopo un timeout.",
  "Nei test in campo aperto il collegamento ha tenuto oltre i 2 km, con un throughput medio di circa 640 byte al secondo. Quello che non sapeva fare era recuperare un pezzo perso. Aggiungerlo senza sprecare tempo in aria è diventato LAMP.",
] }

[[projects.detail.sections]]
heading = { en = "Nemesis", it = "Nemesis" }
body = { en = [
  "For Nemesis the avionics moved to the round white board in the photo, and the flight software became a state machine with 12 states, from calibration on the pad to recovered on the ground. The code on the screen is the transition out of powered flight: it waits for a sustained drop in acceleration before switching to the ballistic phase. The parachutes fire on entering apogee.",
], it = [
  "Per Nemesis l'avionica è passata alla scheda bianca rotonda della foto, e il software di volo è diventato una macchina a stati con 12 stati, dalla calibrazione sulla rampa al razzo recuperato. Il codice sullo schermo è la transizione che chiude il volo propulso: aspetta un calo prolungato dell'accelerazione prima di passare alla fase balistica. I paracadute partono all'ingresso in apogeo.",
] }
diagram = "flight-states"
caption = { en = "The 12 flight states of the Nemesis flight software.", it = "I 12 stati di volo del software di Nemesis." }
image = { file = "old-avionics", widths = [800, 1600], w = 1600, h = 1200, alt = { en = "The round white Nemesis avionics board in front of a monitor showing C++ code for the ACCELERATED_FLIGHT state of the flight state machine", it = "La scheda di avionica bianca e rotonda di Nemesis davanti a un monitor con il codice C++ dello stato ACCELERATED_FLIGHT della macchina a stati di volo" }, caption = { en = "The Nemesis avionics board, with the flight state machine on screen. Photo: Aurora Rocketry.", it = "La scheda di avionica di Nemesis, con la macchina a stati di volo sullo schermo. Foto: Aurora Rocketry." } }

[[projects.detail.sections]]
heading = { en = "Nemesis at EuRoC 2025", it = "Nemesis a EuRoC 2025" }
body = { en = [
  "In the electronics bay our board flew next to a second, independent flight computer: a commercial one, based on the Cats Vega. Nemesis launched at EuRoC 2025, and the software for the next rocket refines this one: the base and the states are the same.",
], it = [
  "Nella electronics bay la nostra scheda ha volato accanto a un secondo flight computer indipendente: uno commerciale, basato su Cats Vega. Nemesis è stato lanciato a EuRoC 2025, e il software del razzo successivo raffina questo: la base e gli stati sono gli stessi.",
] }
image = { file = "nemesis-ebay", widths = [714], w = 714, h = 952, alt = { en = "The Nemesis electronics bay on a table: round boards with green and pink LEDs, stacked on threaded rods with twisted wiring, under an aluminium bulkhead", it = "La electronics bay di Nemesis su un tavolo: schede rotonde con LED verdi e rosa, impilate su barre filettate con cavi intrecciati, sotto una paratia in alluminio" }, caption = { en = "The Nemesis electronics bay, powered up on the bench.", it = "La electronics bay di Nemesis, accesa al banco." } }
gallery = [
  { file = "team-euroc-before", widths = [996], w = 996, h = 560, alt = { en = "The Aurora Rocketry team cheering with an Italian flag in front of the European Rocketry Challenge backdrop", it = "Il team di Aurora Rocketry che esulta con una bandiera italiana davanti al pannello della European Rocketry Challenge" } },
  { file = "team-euroc-after", widths = [1080], w = 1080, h = 608, alt = { en = "The team outdoors on dusty ground, arms raised, holding shovels and an Italian flag", it = "Il team all'aperto su un terreno polveroso, con le braccia alzate, pale e una bandiera italiana" } },
]
gallery_caption = { en = "The team at EuRoC 2025, before and after the launch.", it = "Il team a EuRoC 2025, prima e dopo il lancio." }

[[projects]]
slug = "lamp"
featured = true
title = "LAMP"
subtitle = { en = "Bulk data transfer over LoRa", it = "Trasferire tanti dati su LoRa" }
stack = ["C++17", "LoRa", "SX1262", "ns-3", "Unity"]
summary = { en = "A LoRa frame holds about 255 bytes, so a flight log has to be sent in pieces. The usual approach waits for an ACK after every piece. LAMP sends a burst and gets back a single bitmap of what's missing. In ns-3, in an urban channel at SF7, that gives 4.6 km of range at 90% delivery, against 3.4 km for stop-and-wait. I'm writing the paper with Prof. Andrea Piroddi.", it = "Un frame LoRa contiene circa 255 byte, quindi un log di volo va spedito a pezzi. L'approccio classico aspetta un ACK dopo ogni pezzo. LAMP manda una raffica e riceve un'unica bitmap con quello che manca. In ns-3, in canale urbano a SF7, questo vuol dire 4,6 km di portata con il 90% dei pacchetti consegnati, contro 3,4 km dello stop-and-wait. Sto scrivendo il paper con il Prof. Andrea Piroddi." }
caption = { en = "Top: one chunk on air. Below: chunk 3 is lost. Stop-and-wait pays an ACK per chunk; LAMP pays one bitmap per burst and resends only chunk 3.", it = "In alto: un pezzo in trasmissione. Sotto: il pezzo 3 va perso. Lo stop-and-wait paga un ACK per pezzo; LAMP una bitmap per raffica, e ritrasmette solo il pezzo 3." }
links = [
  { kind = "code", url = "https://github.com/aleemont1/LAMP" },
  { kind = "paper", url = "https://aleemont1.github.io/lora-paper/" },
]

[projects.detail]
diagram = "lamp"
meta = { en = "Research with Prof. Andrea Piroddi, University of Bologna · July 2025 – now", it = "Ricerca con il Prof. Andrea Piroddi, Università di Bologna · luglio 2025 – oggi" }
intro = { en = [
  "LAMP grew out of the rocket telemetry in my bachelor's thesis. That protocol split data into chunks but had no way to recover a lost one. LAMP adds recovery, and the question behind it is how to do that without spending the little airtime LoRa gives you on acknowledgments.",
], it = [
  "LAMP nasce dalla telemetria del razzo della mia tesi triennale. Quel protocollo divideva i dati in pezzi, ma non aveva modo di recuperarne uno perso. LAMP aggiunge il recupero, e la domanda dietro è come farlo senza spendere in conferme il poco tempo in aria che LoRa ti concede.",
] }

[[projects.detail.sections]]
heading = { en = "Why acknowledgments are expensive", it = "Perché le conferme costano" }
body = { en = [
  "LoRa trades speed for range: at SF7 a full frame stays on air for about 0.4 seconds, and in the EU 868 MHz band you may only transmit for a fraction of the time. Stop-and-wait sends a chunk, waits for its ACK, then sends the next. Every ACK costs airtime, and every lost ACK costs a retry even if the data arrived fine.",
], it = [
  "LoRa scambia velocità con portata: a SF7 un frame pieno resta in aria per circa 0,4 secondi, e nella banda europea a 868 MHz si può trasmettere solo per una frazione del tempo. Lo stop-and-wait manda un pezzo, aspetta il suo ACK, poi manda il successivo. Ogni ACK costa tempo in aria, e ogni ACK perso costa un tentativo anche se i dati erano arrivati.",
] }

[[projects.detail.sections]]
heading = { en = "How LAMP does it", it = "Come funziona LAMP" }
body = { en = [
  "A payload is split into up to 255 chunks per transmission window. Each chunk has a 9-byte header, with 8-bit node addresses, and a 2-byte CRC-16. Start and end of a message are implied by the chunk index, so they cost no header bits.",
  "There are four modes: connectionless or with a handshake, best-effort or with SACK-ARQ. In the reliable modes the receiver stays quiet until the end of a burst, then answers with one bitmap marking every missing chunk, and the sender resends only those. The core is plain C++17 with no radio code in it; the unit tests run on a laptop.",
], it = [
  "Un payload viene diviso in un massimo di 255 pezzi per finestra di trasmissione. Ogni pezzo ha un header di 9 byte, con indirizzi dei nodi a 8 bit, e un CRC-16 di 2 byte. Inizio e fine del messaggio si deducono dall'indice del pezzo, quindi non costano bit nell'header.",
  "Ci sono quattro modalità: senza connessione o con handshake, best-effort o con SACK-ARQ. Nelle modalità affidabili il ricevitore sta zitto fino alla fine della raffica, poi risponde con una bitmap che segna tutti i pezzi mancanti, e il mittente ritrasmette solo quelli. Il core è C++17 puro, senza codice radio; i test unitari girano su un portatile.",
] }

[[projects.detail.sections]]
heading = { en = "Results", it = "Risultati" }
chart = "lamp-range"
body = { en = [
  "I ran 295,800 ns-3 simulations across static, urban, rural and over-water channels. Compared with stop-and-wait, the range at 90% delivery grows by 22–35% in urban channels, 14% over water and 8–17% in rural ones. Where the channel is clean, the SACK modes are 14–16% faster at SF7.",
  "What LAMP doesn't change is the duty cycle. Under a 10% limit, sustained throughput is bound by airtime, around 488 bit/s at SF7, whatever the mode. What changes is how long a single transfer takes and how likely it is to get through fading. The simulations were checked on a bench with two ESP32-S3 / SX1262 boards, within 7%.",
], it = [
  "Ho fatto girare 295.800 simulazioni ns-3 su canali statici, urbani, rurali e sull'acqua. Rispetto allo stop-and-wait, la portata con il 90% di consegna cresce del 22–35% in canale urbano, del 14% sull'acqua e dell'8–17% in campagna. Dove il canale è pulito, le modalità SACK sono più veloci del 14–16% a SF7.",
  "Quello che LAMP non cambia è il duty cycle. Con un limite del 10% il throughput sostenuto dipende dal tempo in aria, circa 488 bit/s a SF7, qualunque sia la modalità. Cambia quanto dura un singolo trasferimento e quanto è probabile che superi il fading. Le simulazioni sono state verificate al banco con due schede ESP32-S3 / SX1262, con scarti entro il 7%.",
] }

