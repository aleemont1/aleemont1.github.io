[[projects.detail.sections]]
heading = { en = "The problem", it = "Il problema" }
body = { en = [
  "LoRa radios reach kilometres on very little power, but a single frame carries at most about 255 bytes and regional duty-cycle limits cap how long you may transmit. Sending anything larger, like a block of flight logs, means splitting it into chunks. The common Stop-and-Wait approach acknowledges every chunk: each acknowledgment costs airtime, and each lost acknowledgment burns a retry.",
], it = [
  "Le radio LoRa coprono chilometri con pochissima energia, ma un frame trasporta al massimo circa 255 byte e i limiti di duty cycle regionali riducono il tempo di trasmissione disponibile. Per inviare qualcosa di più grande, come un blocco di log di volo, bisogna dividerlo in pezzi. L'approccio Stop-and-Wait conferma ogni pezzo: ogni conferma consuma tempo in aria, e ogni conferma persa brucia un tentativo.",
] }

[[projects.detail.sections]]
heading = { en = "The design", it = "Il progetto" }
body = { en = [
  "LAMP splits a payload into up to 255 chunks per transmission window. Each chunk carries a 9-byte logical header with compact 8-bit node addressing and a 2-byte CRC-16. Start and end of a message are derived from the chunk index, so the header spends no bytes on them.",
  "The protocol offers four modes, combining connectionless or stateful operation with best-effort or SACK-ARQ reliability. In the reliable modes the receiver answers only at the end of a burst, with one cumulative bitmap that marks every chunk it is missing; the sender retransmits just those. The core is plain C++17, decoupled from the radio driver, and its unit tests run natively on a desktop.",
], it = [
  "LAMP divide un payload in un massimo di 255 pezzi per finestra di trasmissione. Ogni pezzo ha un header logico di 9 byte con indirizzamento compatto a 8 bit e un CRC-16 di 2 byte. Inizio e fine del messaggio si ricavano dall'indice del pezzo, quindi l'header non spende byte per segnalarli.",
  "Il protocollo offre quattro modalità, combinando funzionamento senza connessione o con stato e affidabilità best-effort o SACK-ARQ. Nelle modalità affidabili il ricevitore risponde solo alla fine di una raffica, con un'unica bitmap cumulativa che indica tutti i pezzi mancanti; il mittente ritrasmette solo quelli. Il core è C++17 puro, separato dal driver radio, e i test unitari girano nativamente su desktop.",
] }

[[projects.detail.sections]]
heading = { en = "Results", it = "Risultati" }
chart = "lamp-range"
body = { en = [
  "In urban propagation at SF7 the reliable connectionless mode keeps 90% delivery up to 4.6 km, against 3.4 km for Stop-and-Wait. Across urban channels the gain is 22–35%, and in the lossless region the SACK modes are 14–16% faster than Stop-and-Wait at SF7. Simulated results were validated on a two-board ESP32-S3 / SX1262 bench, within 7%.",
], it = [
  "In propagazione urbana a SF7 la modalità affidabile senza connessione mantiene il 90% di consegna fino a 4,6 km, contro 3,4 km di Stop-and-Wait. Nei canali urbani il guadagno è del 22–35%, e dove il canale non perde pacchetti le modalità SACK sono più veloci del 14–16% rispetto a Stop-and-Wait a SF7. I risultati simulati sono stati validati su un banco con due schede ESP32-S3 / SX1262, con scarti entro il 7%.",
] }

