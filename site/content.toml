[[projects.detail.sections]]
heading = { en = "The problem", it = "Il problema" }
body = { en = [
  "A sounding rocket gives you one flight. The firmware has to detect launch, track the climb, find apogee and deploy the parachutes at the right moment, while recording everything and keeping the ground station informed. There is no second attempt if a task stalls or a sensor drops out.",
], it = [
  "Un razzo sonda vola una volta sola. Il firmware deve riconoscere il lancio, seguire la salita, individuare l'apogeo e aprire i paracadute al momento giusto, registrando tutto e tenendo aggiornata la stazione di terra. Se un task si blocca o un sensore smette di rispondere non c'è un secondo tentativo.",
] }

[[projects.detail.sections]]
heading = { en = "How it works", it = "Come funziona" }
body = { en = [
  "Atlas is built around a 12-state flight state machine, from calibration and pre-launch checks to recovery. The state machine runs as a 50 Hz FreeRTOS task guarded by a watchdog. On every transition it compares the set of tasks the new state needs with the ones already running, stops the rest and starts what is missing, so a state never pays for work it doesn't need.",
  "Sensor polling and altitude estimation run on one core at 50 Hz; storage, telemetry and the ground dashboard run on the other. Apogee is detected from barometric altitude: a median filter smooths the readings and a least-squares fit over a sliding window estimates vertical velocity, with a time lockout and a time backstop as safety nets.",
  "Before launch the board serves a web dashboard over its own Wi-Fi access point, used to check sensor health, edit flight parameters and update the firmware. Parameters are validated and frozen into an immutable snapshot when the rocket is declared ready for launch.",
], it = [
  "Atlas ruota intorno a una macchina a stati di volo con 12 stati, dalla calibrazione e i controlli pre-lancio fino al recupero. La macchina a stati è un task FreeRTOS a 50 Hz protetto da un watchdog. A ogni transizione confronta i task richiesti dal nuovo stato con quelli già attivi, ferma quelli inutili e avvia quelli mancanti: nessuno stato spende risorse per lavoro che non gli serve.",
  "Lettura dei sensori e stima dell'altitudine girano su un core a 50 Hz; salvataggio, telemetria e dashboard di terra sull'altro. L'apogeo viene rilevato dall'altitudine barometrica: un filtro mediano pulisce le letture e una regressione ai minimi quadrati su finestra mobile stima la velocità verticale, con un blocco temporale e un limite massimo di tempo come reti di sicurezza.",
  "Prima del lancio la scheda espone una dashboard web tramite un proprio access point Wi-Fi, usata per controllare lo stato dei sensori, modificare i parametri di volo e aggiornare il firmware. I parametri vengono validati e congelati in uno snapshot immutabile quando il razzo è dichiarato pronto al lancio.",
] }

[[projects.detail.sections]]
heading = { en = "Testing without flying", it = "Testare senza volare" }
body = { en = [
  "Flights are rare, so the firmware has a hardware-in-the-loop mode: a RocketPy simulation feeds sensor data to the board over TCP in lockstep, and the real state machine, filters and recovery logic react to it. A guided hardware test routine checks every sensor and output on the bench.",
  "The telemetry chain behind Atlas became the subject of my bachelor's thesis, and the need to send more than one LoRa frame at a time led to LAMP.",
], it = [
  "I voli sono rari, quindi il firmware ha una modalità hardware-in-the-loop: una simulazione RocketPy invia i dati dei sensori alla scheda via TCP in lockstep, e la vera macchina a stati, i filtri e la logica di recupero reagiscono a quei dati. Una routine di test guidata verifica al banco ogni sensore e ogni uscita.",
  "La catena di telemetria di Atlas è diventata l'argomento della mia tesi triennale, e il bisogno di inviare più di un frame LoRa alla volta ha portato a LAMP.",
] }

