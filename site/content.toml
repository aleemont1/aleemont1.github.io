# The opening paragraphs, under the name.
[intro]
body = { en = [
  "I write embedded software: mostly C++ on ESP32s, mostly for things that are supposed to fly.",
  "I lead the avionics software of Aurora Rocketry, the University of Bologna's student rocketry team, and I do research on moving large amounts of data over LoRa without wasting airtime. I'm doing an MSc in Computer Science and Engineering in Bologna, and I spent the spring of 2026 on Erasmus in Reykjavík.",
  "During the day I'm a software developer at a company that makes enterprise software. Not as thrilling as rockets, I know. The long-term plan is to have some code of mine running in space before I turn 32.",
], it = [
  "Scrivo software embedded: per lo più C++ su ESP32, per lo più per cose che dovrebbero volare.",
  "Guido lo sviluppo del software di avionica di Aurora Rocketry, il team studentesco di razzi dell'Università di Bologna, e faccio ricerca su come trasferire tanti dati su LoRa senza sprecare tempo in aria. Frequento la magistrale in Ingegneria e Scienze Informatiche a Bologna, e ho passato la primavera del 2026 in Erasmus a Reykjavík.",
  "Di giorno faccio lo sviluppatore in un'azienda che produce software gestionale. Meno emozionante dei razzi, lo so. Il piano a lungo termine è avere del codice mio in orbita prima dei 32 anni.",
] }

